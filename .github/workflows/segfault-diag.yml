name: Segfault diag (TEMPORARY)

on:
  push:
    branches: [claude/segfault-diag-b6]
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen
  LADRUNO_OPENSEES_QUIET: "1"
  PYTHONFAULTHANDLER: "1"

jobs:
  ab:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: probe-F-FIXED
            revert: 'no'
          - name: probe-F-UNFIXED
            revert: 'yes'
    name: ${{ matrix.name }}
    env:
      APEGMSH_EXPECT_GL: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revert the fix (control arm)
        if: matrix.revert == 'yes'
        run: |
          git checkout 1e87ed7a -- src/apeGmsh/sections/_properties.py
          grep -c "_no_cyclic_gc" src/apeGmsh/sections/_properties.py || echo "fix absent (expected)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libglu1-mesa
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,viewer,dxf,partition-pymetis,section-oracle]" pytest
      - name: mode F x6
        run: |
          set +e
          crashes=0
          for rep in 1 2 3 4 5 6; do
            python scratchpad_diag/shiboken_probe.py F > /tmp/f$rep.log 2>&1
            rc=$?
            echo "rep ${rep} EXIT ${rc}"
            [ "$rc" != "0" ] && crashes=$((crashes+1))
          done
          echo "=============================================="
          echo "RESULT ${{ matrix.name }}: ${crashes} / 6 crashed"
          echo "=============================================="
          grep -h "Shiboken\|Fatal Python" /tmp/f*.log | head -3
          exit 0

  suite:
    runs-on: ubuntu-latest
    env:
      APEGMSH_EXPECT_GL: "1"
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libglu1-mesa
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,viewer,dxf,partition-pymetis,section-oracle]" pytest
      - name: Curated suite (EXACT lane command)
        run: |
          pytest tests -q -p no:cacheprovider \
            -m "not live and not subprocess and not bench and not qt"
      - name: tests/sections x10
        run: |
          set +e
          crashes=0
          for i in $(seq 1 10); do
            pytest tests/sections -q -p no:cacheprovider \
              -m "not live and not subprocess and not bench and not qt" > /tmp/s$i.log 2>&1
            rc=$?; [ "$rc" != "0" ] && { crashes=$((crashes+1)); tail -20 /tmp/s$i.log; }
          done
          echo "RESULT sections reps: ${crashes} / 10 non-zero"
          exit "${crashes}"
