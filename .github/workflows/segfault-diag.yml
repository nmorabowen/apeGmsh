name: Segfault diag (TEMPORARY)

on:
  push:
    branches: [claude/segfault-diag-b6]
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen
  LADRUNO_OPENSEES_QUIET: "1"
  PYTHONFAULTHANDLER: "1"

jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: exact-a
            ref: ''
          - name: exact-b
            ref: ''
          - name: old-main-a8d90407
            ref: a8d90407
    name: ${{ matrix.name }}
    env:
      APEGMSH_EXPECT_GL: "1"
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin to the crash-state commit
        if: matrix.name == 'old-main-a8d90407'
        run: |
          git checkout a8d90407
          git log --oneline -1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install apt deps for Qt/VTK (+ gdb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libglu1-mesa gdb
      - name: Install package (no openseespy)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,viewer,dxf,partition-pymetis,section-oracle]" pytest
      - name: Arm core dumps
        run: |
          sudo mkdir -p /tmp/cores
          sudo chmod 1777 /tmp/cores
          sudo sysctl -w kernel.core_pattern='/tmp/cores/core.%e.%p'
      - name: Run curated suite (EXACT lane command)
        run: |
          set +e
          ulimit -c unlimited
          pytest tests -q -p no:cacheprovider \
            -m "not live and not subprocess and not bench and not qt" 2>&1 | tee /tmp/pytest.log
          echo "exit code: ${PIPESTATUS[0]}"
          exit 0
      - name: Last 150 lines
        if: always()
        run: tail -150 /tmp/pytest.log || true
      - name: Kernel segfault line (names the offending .so)
        if: always()
        run: sudo dmesg | grep -iE "segfault|general protection|trap|core dump" | tail -30 || echo "no dmesg hits"
      - name: Native backtrace from core
        if: always()
        run: |
          ls -l /tmp/cores || true
          for c in /tmp/cores/core.*; do
            [ -e "$c" ] || continue
            echo "::group::gdb ${c}"
            gdb -batch -q -ex "set pagination off" \
              -ex "thread apply all bt 40" -ex "info sharedlibrary" \
              "$(which python)" "$c" 2>&1 | head -400
            echo "::endgroup::"
          done
