name: Segfault diag (TEMPORARY)

on:
  push:
    branches: [claude/segfault-diag-b6]
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen
  LADRUNO_OPENSEES_QUIET: "1"
  PYTHONFAULTHANDLER: "1"

jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline-x3
            gcoff: '0'
            trace: '0'
            reps: '3'
          - name: trace-threads
            gcoff: '0'
            trace: '1'
            reps: '1'
          - name: gc-disabled-x3
            gcoff: '1'
            trace: '0'
            reps: '3'
    name: ${{ matrix.name }}
    env:
      APEGMSH_EXPECT_GL: "1"
      DIAG_GC_OFF: ${{ matrix.gcoff }}
      DIAG_TRACE_WIN: ${{ matrix.trace }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install apt deps for Qt/VTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libglu1-mesa
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,viewer,dxf,partition-pymetis,section-oracle]" pytest
      - name: Run tests/sections x${{ matrix.reps }}
        run: |
          set +e
          for i in $(seq 1 ${{ matrix.reps }}); do
            echo "::group::rep ${i}"
            PYTHONPATH=. pytest tests/sections -q -p no:cacheprovider -p diagplug \
              -m "not live and not subprocess and not bench and not qt" 2>&1 | tail -60
            echo "REP ${i} EXIT: ${PIPESTATUS[0]}"
            echo "::endgroup::"
          done
          exit 0
