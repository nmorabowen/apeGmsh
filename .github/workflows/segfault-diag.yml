name: Segfault diag (TEMPORARY)

on:
  push:
    branches: [claude/segfault-diag-b6]
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen
  LADRUNO_OPENSEES_QUIET: "1"
  PYTHONFAULTHANDLER: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      APEGMSH_EXPECT_GL: "1"
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install apt deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libglu1-mesa gdb
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,viewer,dxf,partition-pymetis,section-oracle]" pytest
      - name: Arm cores
        run: |
          sudo mkdir -p /tmp/cores && sudo chmod 1777 /tmp/cores
          sudo sysctl -w kernel.core_pattern='/tmp/cores/core.%e.%p'
      - name: Run probes
        run: |
          set +e
          ulimit -c unlimited
          for m in A B C D E; do
            echo "::group::mode ${m}"
            for rep in 1 2 3; do
              python scratchpad_diag/shiboken_probe.py "$m" 2>&1 | tail -12
              echo "  mode ${m} rep ${rep} EXIT ${PIPESTATUS[0]}"
            done
            echo "::endgroup::"
          done
          exit 0
      - name: Backtraces
        if: always()
        run: |
          for c in /tmp/cores/core.*; do
            [ -e "$c" ] || continue
            echo "::group::gdb $c"
            gdb -batch -q -ex "set pagination off" -ex "bt 20" "$(which python)" "$c" 2>&1 | head -40
            echo "::endgroup::"
          done
