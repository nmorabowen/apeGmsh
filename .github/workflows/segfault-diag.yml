name: Segfault diag (TEMPORARY)

on:
  push:
    branches: [claude/segfault-diag-b6]
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen
  LADRUNO_OPENSEES_QUIET: "1"
  PYTHONFAULTHANDLER: "1"

jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full-suite
            args: 'tests -m "not live and not subprocess and not bench and not qt"'
          - name: prefix-only
            args: 'tests --ignore=tests/viewers --ignore=tests/studio --ignore=tests/sensitivity --ignore-glob=tests/test_*.py -m "not live and not subprocess and not bench and not qt"'
          - name: sections-alone
            args: 'tests/sections -m "not live and not subprocess and not bench and not qt"'
    name: ${{ matrix.name }}
    env:
      APEGMSH_EXPECT_GL: "1"
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install apt deps for Qt/VTK (+ gdb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libglu1-mesa gdb
      - name: Install package (no openseespy)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,viewer,dxf,partition-pymetis,section-oracle]" pytest
      - name: Arm core dumps
        run: |
          sudo mkdir -p /tmp/cores
          sudo chmod 1777 /tmp/cores
          sudo sysctl -w kernel.core_pattern='/tmp/cores/core.%e.%p'
          cat /proc/sys/kernel/core_pattern
      - name: Run
        id: run
        run: |
          set +e
          ulimit -c unlimited
          ulimit -c
          stdbuf -oL -eL python -X faulthandler -m pytest ${{ matrix.args }} \
            -q -p no:cacheprovider 2>&1 | tee /tmp/pytest.log
          code="${PIPESTATUS[0]}"
          echo "exit code: ${code}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Last 120 lines
        if: always()
        run: tail -120 /tmp/pytest.log || true
      - name: Kernel segfault line (names the offending .so)
        if: always()
        run: |
          sudo dmesg | grep -iE "segfault|general protection|trap|core dump" | tail -30 || echo "no dmesg hits"
      - name: Native backtrace from core
        if: always()
        run: |
          ls -l /tmp/cores || true
          for c in /tmp/cores/core.*; do
            [ -e "$c" ] || continue
            echo "::group::gdb ${c}"
            gdb -batch -q \
              -ex "set pagination off" \
              -ex "thread apply all bt 40" \
              -ex "info sharedlibrary" \
              "$(which python)" "$c" 2>&1 | head -400
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.name }}
          path: |
            /tmp/pytest.log
          if-no-files-found: warn
