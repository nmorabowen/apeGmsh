name: live-fork

# Nightly run of the `ladruno_fork` tests against the fork build pinned in
# FORK_PIN. NOT a required check: do not add it to branch protection.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APEGMSH_FORK_PIN_ENFORCE: '1'
    steps:
      - uses: actions/checkout@v4

      # The fork tarball is built for cp311.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install apt deps for gmsh/VTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libglu1-mesa

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,viewer,dxf]" pytest

      - name: Fetch the pinned fork build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pin() { grep -E "^$1=" FORK_PIN | cut -d= -f2-; }
          tag=$(pin tag); repo=$(pin repo); asset=$(pin asset)
          mkdir -p "$RUNNER_TEMP/fork"
          gh release download "$tag" -R "$repo" -p "$asset" -D "$RUNNER_TEMP/fork"
          tar xzf "$RUNNER_TEMP/fork/$asset" -C "$RUNNER_TEMP/fork" --strip-components=1
          ls -l "$RUNNER_TEMP/fork"
          cat "$RUNNER_TEMP/fork/BUILD_INFO.txt"
          # `import opensees` resolves to opensees.so on PYTHONPATH.
          echo "PYTHONPATH=$RUNNER_TEMP/fork" >> "$GITHUB_ENV"

      - name: Run ladruno_fork tests
        run: |
          # -m replaces pyproject's addopts expression, so `not qt` is repeated.
          pytest tests -q -rs -p no:cacheprovider \
            -m "ladruno_fork and not qt and not subprocess and not bench" \
            --junitxml="$RUNNER_TEMP/live-fork.xml"

      - name: Job summary
        if: always()
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          path = os.path.join(os.environ["RUNNER_TEMP"], "live-fork.xml")
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          if not os.path.exists(path):
              out.write("## live-fork\n\nNo junit XML was written.\n")
              raise SystemExit(0)
          n = {"passed": 0, "failed": 0, "skipped": 0}
          mkl = mismatch = 0
          failed = []
          for tc in ET.parse(path).getroot().iter("testcase"):
              sk = tc.find("skipped")
              if tc.find("failure") is not None or tc.find("error") is not None:
                  n["failed"] += 1
                  failed.append(f'{tc.get("classname")}::{tc.get("name")}')
              elif sk is not None:
                  n["skipped"] += 1
                  msg = sk.get("message", "")
                  mkl += "ladruno_mkl:" in msg
                  mismatch += "fork build mismatch" in msg
              else:
                  n["passed"] += 1
          out.write("## live-fork\n\n| passed | failed | skipped | ladruno_mkl skips | build-mismatch skips |\n|---|---|---|---|---|\n")
          out.write(f'| {n["passed"]} | {n["failed"]} | {n["skipped"]} | {mkl} | {mismatch} |\n')
          if failed:
              out.write("\nFailed:\n\n" + "\n".join(f"- `{f}`" for f in failed) + "\n")
          PY
