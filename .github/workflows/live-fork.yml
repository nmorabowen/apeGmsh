name: live-fork

# Nightly run of the `ladruno_fork` tests against the fork build pinned in
# FORK_PIN. NOT a required check: do not add it to branch protection.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-fork:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APEGMSH_FORK_PIN_ENFORCE: '1'
      # ADR 0121 D3: a warrant-row test (tests/opensees/warrant_rows.py)
      # that skips or goes unselected fails the job, except a
      # `ladruno_mkl:` skip, which counts for the lane and never for the
      # member (ruling 3).
      APEGMSH_WARRANT_LANE: fork
    steps:
      - uses: actions/checkout@v4

      # The fork tarball is built for cp311.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install apt deps for gmsh/VTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libglu1-mesa

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,viewer,dxf]" pytest

      # FORK_PIN names the `-mkl` tarball: FEAST and Pardiso linked
      # dynamically against MKL, which the tarball does not ship.
      # opensees.so NEEDs libmkl_*.so.2, so without this `import opensees`
      # fails outright. mkl 2026.x ships .so.3, hence the upper bound.
      - name: Install the MKL runtime
        run: |
          set -euo pipefail
          pip install "mkl>=2024.2.2,<2026"
          mkl_lib=$(python - <<'PY'
          import importlib.metadata as md, pathlib
          dist = md.distribution("mkl")
          dirs = sorted({
              str(pathlib.Path(dist.locate_file(f)).resolve().parent)
              for f in (dist.files or ())
              if f.name.startswith("libmkl_core.so.2")
          })
          if len(dirs) != 1:
              raise SystemExit(f"expected one libmkl_core.so.2 dir, got {dirs}")
          print(dirs[0])
          PY
          )
          ls -l "$mkl_lib"/libmkl_*.so.2
          echo "LD_LIBRARY_PATH=$mkl_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          # The -mkl build takes all its BLAS/LAPACK from MKL, which picks
          # its kernels by CPU (#2602). The lane runs MKL's default path,
          # the one users get, so it records which CPU and MKL it ran on.
          lscpu | grep -E '^(Model name|Flags):'
          echo "mkl $(python -c 'import importlib.metadata as m; print(m.version("mkl"))')"

      - name: Fetch the pinned fork build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pin() { grep -E "^$1=" FORK_PIN | cut -d= -f2-; }
          tag=$(pin tag); repo=$(pin repo); asset=$(pin asset)
          mkdir -p "$RUNNER_TEMP/fork"
          gh release download "$tag" -R "$repo" -p "$asset" -D "$RUNNER_TEMP/fork"
          tar xzf "$RUNNER_TEMP/fork/$asset" -C "$RUNNER_TEMP/fork" --strip-components=1
          ls -l "$RUNNER_TEMP/fork"
          cat "$RUNNER_TEMP/fork/BUILD_INFO.txt"
          # Install opensees.so into site-packages rather than exporting
          # PYTHONPATH: subprocess tests rebuild PYTHONPATH (src:root) and
          # would drop the fork dir, so the child could not import it.
          purelib=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          cp "$RUNNER_TEMP"/fork/opensees*.so "$purelib/"
          ls -l "$purelib"/opensees*.so
          # Every NEEDED library must resolve (MKL included), or fail here.
          ldd "$purelib"/opensees*.so
          if ldd "$purelib"/opensees*.so | grep -q "not found"; then
            echo "::error::opensees.so has unresolved libraries"; exit 1
          fi

      - name: Assert the installed build is the pinned one
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          unset PYTHONPATH
          export LADRUNO_OPENSEES_QUIET=1
          want=$(grep -E '^sha=' "$GITHUB_WORKSPACE/FORK_PIN" | cut -d= -f2-)
          got=$(python -c "import opensees; print(opensees.ladrunoBuild())" | tail -n1)
          echo "pin=$want build=$got"
          [ "$got" = "$want" ] || { echo "::error::build $got != pin $want"; exit 1; }

      - name: Run ladruno_fork tests
        run: |
          # FEAST, Pardiso and the rest run on MKL's default code path.
          echo "MKL_CBWR=${MKL_CBWR:-<unset>}"
          # -m replaces pyproject's addopts expression, so `not qt` is repeated.
          pytest tests -q -rs -p no:cacheprovider \
            -m "ladruno_fork and not qt and not subprocess and not bench" \
            --deselect tests/interop/test_strut_tie.py::test_cook_mitchell_double_corbel_pushover_against_the_paper \
            --junitxml="$RUNNER_TEMP/live-fork.xml"

      # TEMP (#2602): corbel softening peak depends on the MKL code path; remove when #2602 closes
      - name: Run the Cook-Mitchell corbel test (MKL_CBWR=COMPATIBLE)
        if: ${{ !cancelled() }}
        env:
          MKL_CBWR: COMPATIBLE
        run: |
          set -euo pipefail
          echo "MKL_CBWR=${MKL_CBWR:-<unset>}"
          # The warrant-lane rule needs every row test selected; this step
          # runs one test that is not a row, so the rule stays with the main step.
          unset APEGMSH_WARRANT_LANE
          pytest -q -rs -p no:cacheprovider \
            -m "ladruno_fork and not qt and not subprocess and not bench" \
            tests/interop/test_strut_tie.py::test_cook_mitchell_double_corbel_pushover_against_the_paper \
            --junitxml="$RUNNER_TEMP/live-fork-corbel.xml"
          # A skip or a deselection is not a pass: exactly one passing case.
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          path = os.path.join(os.environ["RUNNER_TEMP"], "live-fork-corbel.xml")
          cases = list(ET.parse(path).getroot().iter("testcase"))
          ok = [c for c in cases if not any(c.find(t) is not None for t in ("failure", "error", "skipped"))]
          if len(cases) != 1 or len(ok) != 1:
              raise SystemExit(f"::error::corbel step: expected 1 passing case, got {len(ok)} of {len(cases)}")
          PY

      # The pinned build carries MKL, so a `ladruno_mkl:` skip here means the
      # MKL runtime broke, not that the build lacks it: fail instead of
      # letting FEAST/Pardiso go untested.
      - name: Assert no ladruno_mkl skips
        if: always()
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          bad = [
              f'{tc.get("classname")}::{tc.get("name")}: {sk.get("message", "")}'
              for name in ("live-fork.xml", "live-fork-corbel.xml")
              for tc in ET.parse(os.path.join(os.environ["RUNNER_TEMP"], name)).getroot().iter("testcase")
              if (sk := tc.find("skipped")) is not None
              and "ladruno_mkl:" in sk.get("message", "")
          ]
          for b in bad:
              print(f"::error::{b}")
          raise SystemExit(1 if bad else 0)
          PY

      # Per-test outcomes (which FEAST / Pardiso cases passed), since -q
      # prints no passing ids.
      - name: Upload the junit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-fork-junit
          path: |
            ${{ runner.temp }}/live-fork.xml
            ${{ runner.temp }}/live-fork-corbel.xml
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          paths = [os.path.join(os.environ["RUNNER_TEMP"], name)
                   for name in ("live-fork.xml", "live-fork-corbel.xml")]
          paths = [p for p in paths if os.path.exists(p)]
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          if not paths:
              out.write("## live-fork\n\nNo junit XML was written.\n")
              raise SystemExit(0)
          n = {"passed": 0, "failed": 0, "skipped": 0}
          mkl = mismatch = 0
          failed = []
          for tc in (tc for p in paths for tc in ET.parse(p).getroot().iter("testcase")):
              sk = tc.find("skipped")
              if tc.find("failure") is not None or tc.find("error") is not None:
                  n["failed"] += 1
                  failed.append(f'{tc.get("classname")}::{tc.get("name")}')
              elif sk is not None:
                  n["skipped"] += 1
                  msg = sk.get("message", "")
                  mkl += "ladruno_mkl:" in msg
                  mismatch += "fork build mismatch" in msg
              else:
                  n["passed"] += 1
          out.write("## live-fork\n\n| passed | failed | skipped | ladruno_mkl skips | build-mismatch skips |\n|---|---|---|---|---|\n")
          out.write(f'| {n["passed"]} | {n["failed"]} | {n["skipped"]} | {mkl} | {mismatch} |\n')
          if failed:
              out.write("\nFailed:\n\n" + "\n".join(f"- `{f}`" for f in failed) + "\n")
          PY
