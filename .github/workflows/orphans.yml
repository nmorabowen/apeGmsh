name: Orphan detector

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find orphaned work
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          python scripts/find_orphans.py --format md > orphans.md
          code=$?
          cat orphans.md
          # 0 clean, 1 findings, 2 a detection failed. A crash (an import error
          # exits 1 with an empty report) must not read as "findings": each of
          # 0 and 1 needs its positive marker in the report, else the job fails.
          # Exit 2 still reports what the other detection found, then fails.
          case "$code" in
            0) if grep -q '^No orphaned work found' orphans.md; then
                 echo "found=0" >> "$GITHUB_OUTPUT"
               else echo "failed=1" >> "$GITHUB_OUTPUT"; fi ;;
            1) if grep -q '^| ' orphans.md; then echo "found=1" >> "$GITHUB_OUTPUT"
               else echo "failed=1" >> "$GITHUB_OUTPUT"; fi ;;
            2) echo "failed=1" >> "$GITHUB_OUTPUT"
               if grep -q '^| ' orphans.md; then echo "found=1" >> "$GITHUB_OUTPUT"; fi ;;
            *) exit "$code" ;;
          esac

      - name: Open or update the tracking issue
        if: steps.find.outputs.found == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[Orphans] merged work not on main'
          number=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          {
            echo "Nightly run $(date -u +%F): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat orphans.md
          } > body.md
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi

      - name: Fail the job when a detection failed
        if: steps.find.outputs.failed == '1'
        run: exit 1
