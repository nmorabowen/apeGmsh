name: Orphan detector

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find orphaned work
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          python scripts/find_orphans.py --format md > orphans.md
          code=$?
          cat orphans.md
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          echo "found=$code" >> "$GITHUB_OUTPUT"

      - name: Open or update the tracking issue
        if: steps.find.outputs.found == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[Orphans] merged work not on main'
          number=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          {
            echo "Nightly run $(date -u +%F): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat orphans.md
          } > body.md
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
