name: Program probe

# Lessons #1567 (stalled program PRs) and #1544 (double lock holders).
# Same permissions as orphans.yml; no secret beyond github.token.

on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
  push:  # TEMP: branch smoke of the token scopes; removed before review
    branches: [claude/t-w2a-program-probe]

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read      # statusCheckRollup: check runs on the PR head
  statuses: read    # statusCheckRollup: commit statuses

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe program PRs and lock labels
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            python scripts/program_probe.py --approved-hours 0 --verdict-hours 0 --lock-hours 0
          else
            python scripts/program_probe.py --issue
          fi
