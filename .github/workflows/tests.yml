name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same ref (saves CI minutes on
# force-push / rapid re-push to a PR).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Viewer / viewer-data tests render through offscreen Qt.
  QT_QPA_PLATFORM: offscreen
  # Harmless without openseespy; keeps parity with local invocation.
  LADRUNO_OPENSEES_QUIET: "1"

jobs:
  # Fast, dedicated job for the regression-lock contract tests. These
  # encode invariants that were silently broken before and must never
  # regress (dimensional resolution contract; constraint emission;
  # MPC math). Kept separate so a lock break is an unambiguous,
  # fast-failing signal distinct from a general suite failure.
  lock-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Canonical skill (skills/apegmsh/) and its derived mirror
      # (.claude/skills/apegmsh-helper/) must stay byte-identical modulo
      # front-matter. Pure-stdlib check, so it runs before the slow installs.
      - name: Skill mirror in sync (canonical -> derived)
        run: python scripts/sync_skill.py --check

      - name: Install apt deps for Qt/VTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libglu1-mesa

      - name: Install package (no openseespy)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,viewer,dxf]" pytest

      - name: Run regression-lock tests
        run: |
          pytest -q -p no:cacheprovider \
            tests/test_resolution_contract.py \
            tests/test_constraint_emission.py \
            tests/test_constraint_mpc_math.py

  # Emit-cost regression tripwire for the ADR 0038 10k x 4 gate cell.
  #
  # The nightly benchmarks.yml runs the full 24-cell matrix but asserts
  # NOTHING — it only writes a markdown table — and its ADR 0038
  # thresholds are a feasibility gate (`deck_emit_sec < 5.0`) sitting an
  # order of magnitude above the ~0.4 s working point. ADR 0065 v2
  # B2+B3 made partitioned emit 2-3x slower and that combination
  # reported PASS for 124 commits (see #876). This job is the missing
  # half: a per-PR check against a committed baseline.
  #
  # Cheap enough to run on every PR (~15 s of measurement), because it
  # runs only the gate cell rather than the 24-cell matrix. It compares
  # emit cost NORMALISED BY PARSE cost, so a slow or busy runner divides
  # out — parse is a bare compile() over the emitted deck and no
  # apeGmsh change can affect it without also moving deck_lines, which
  # is asserted exactly.
  emit-cost-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install apt deps for Qt/VTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libglu1-mesa

      # psutil gates the benchmark module import (peak-RSS metric).
      - name: Install package + benchmark deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,viewer,dxf]" pytest psutil

      # -s so the measured ratios land in the log even on a pass —
      # a regression is much easier to read as a trend than as a
      # single failing assertion.
      - name: Emit-cost regression gate (10k x 4)
        run: |
          pytest -q -p no:cacheprovider -s -m bench \
            tests/benchmarks/test_emit_regression_gate.py

  # Static gates for the strictly-typed bridge package (charter P12;
  # src/apeGmsh/opensees/architecture/testing.md § "CI gating" declared
  # these required but they were never enforced, and drift accumulated).
  # ruff on the opensees package is fully clean -> hard gate. mypy
  # carries a legacy error baseline -> ratchet: the job fails only when
  # the count GROWS. Pay errors down and lower MYPY_BASELINE with them.
  # Tool versions are pinned because both tools add rules/checks across
  # releases, which would move the measured count under our feet; bump
  # the pins and re-measure the baseline together, in one PR.
  static-gates:
    runs-on: ubuntu-latest
    env:
      # 0 = the package is mypy-clean; the ratchet is now a hard gate.
      # The ratchet machinery stays so a future tool-pin bump that
      # moves the measured count can be absorbed deliberately
      # (bump pins + re-measure + adjust in one PR).
      MYPY_BASELINE: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Same extras as the suite job so mypy sees the same dependency
      # surface (resolved imports change the error count).
      - name: Install package + pinned tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,viewer,dxf]" "mypy==1.20.0" "ruff==0.15.9"

      - name: ruff (opensees package, hard gate)
        run: ruff check src/apeGmsh/opensees

      - name: mypy ratchet (opensees package)
        run: |
          mypy src/apeGmsh/opensees > mypy.out 2>&1 || true
          tail -n 3 mypy.out
          count=$(grep -oE 'Found [0-9]+ error' mypy.out | grep -oE '[0-9]+' || echo 0)
          echo "mypy errors: ${count} (baseline: ${MYPY_BASELINE})"
          if [ "${count}" -gt "${MYPY_BASELINE}" ]; then
            echo "::error::mypy error count grew (${count} > baseline ${MYPY_BASELINE}) — fix the new errors, don't raise the baseline"
            grep ': error:' mypy.out | tail -n 40
            exit 1
          fi
          if [ "${count}" -lt "${MYPY_BASELINE}" ]; then
            echo "::notice::mypy errors dropped to ${count} — lower MYPY_BASELINE in tests.yml to lock in the gain"
          fi

  # Real-window Qt lifecycle tests (ADR 0084 D7, fork F-B). These 15
  # tests across 9 files build actual ResultsViewer/QtInteractor
  # windows; they were deselected by addopts (`-m "not qt"`) and
  # skipped everywhere because pytest-qt was never installed — the
  # historical first real run found genuine bugs (ActiveObjects never
  # seeded), so this lane exists to keep that class visible.
  #
  # Discipline mandated by pyproject.toml's qt marker docstring:
  # one pytest PROCESS per file — QtInteractor windows pollute shared
  # VTK/Qt state. `xvfb-run -a` per file also gives each a fresh X
  # server. The job env overrides the workflow-level
  # QT_QPA_PLATFORM=offscreen: these tests need a real windowing
  # platform for their GL context.
  qt-window-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: xcb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install apt deps for Qt/VTK + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libglu1-mesa \
            xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0

      - name: Install package + pytest-qt
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,viewer,dxf]" pytest pytest-qt

      # Files are discovered, not hardcoded, so a new qt-marked file
      # joins the lane automatically. All files run even after a
      # failure; the job fails at the end so one CI run reports the
      # full per-file picture.
      - name: Run qt tests (one process + one X server per file)
        run: |
          failed=0
          for f in $(grep -rl "pytest\.mark\.qt" tests/viewers --include="*.py" | sort); do
            echo "::group::${f}"
            # timeout: a test that loses its window-close path hangs
            # the Qt loop forever (seen on the lane's first run) — cap
            # each file rather than eating the 6 h job limit.
            timeout 300 xvfb-run -a pytest "${f}" -q -p no:cacheprovider -m qt \
              || { failed=1; echo "::error::qt lane failed in ${f}"; }
            echo "::endgroup::"
          done
          exit "${failed}"

  # The curated suite: everything under tests/ except markers that
  # need an OpenSees runtime not installed here. `live` needs
  # openseespy; `subprocess` needs the standalone OPENSEES binary;
  # `bench` is opt-in perf. openseespy is intentionally NOT installed
  # — opensees-importing tests are marker- or importorskip-guarded and
  # skip cleanly.
  suite:
    runs-on: ubuntu-latest
    # A test that blocks (a real Qt window with no display, a lost
    # close path) otherwise eats the 6 h job limit and reports nothing
    # — the job stays "in progress" and its logs are unreadable until
    # it ends, so the hang is invisible exactly when you need to see
    # it. The qt lane already learned this and caps each file at 300 s.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install apt deps for Qt/VTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libglu1-mesa

      - name: Install package (no openseespy)
        run: |
          python -m pip install --upgrade pip
          # partition-pymetis: opt-in extra added in this PR (feat/partition-weighted).
          # Installs pymetis (METIS Python bindings) so TestPartitionWeighted runs
          # against the real backend on Linux instead of being importorskip'd.
          # section-oracle: dev-only PyPI `sectionproperties` oracle (ADR 0078)
          # so the analyzer's package-comparison tests run here instead of
          # being importorskip'd (they stay skipped in every other lane).
          pip install -e ".[plot,viewer,dxf,partition-pymetis,section-oracle]" pytest

      - name: Run curated suite
        env:
          # Unbuffered so the last line in a killed job's log is the
          # test that was actually running when it hung.
          PYTHONUNBUFFERED: '1'
        run: |
          pytest tests -v -p no:cacheprovider \
            -m "not live and not subprocess and not bench"
