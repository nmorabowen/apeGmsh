name: Review verdict

# Lesson #2637: a web merge never runs land_pr, so the T review policy is posted
# as the `review-verdict` commit status on the PR head; marked required, it makes
# the merge button refuse a head no Review-verdict approved.
#
# Trust boundary: both triggers run in the base repository's context with a
# write token, so neither job executes PR code. The status job checks out the
# default branch only (pull_request_target already takes this file from there),
# never persists the token in .git, and reads the PR through the API. The token
# can write commit statuses and nothing else. A fork PR runs the same way.

on:
  pull_request_target:
    # `closed`: a PR leaving a shared head re-decides the PRs still open on it.
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, edited, closed]
  issue_comment:
    types: [created, edited, deleted]

permissions: {}

jobs:
  head:
    # issue_comment also fires on plain issues; only PR comments matter.
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read   # a comment event carries no head: read it
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      # The commit the status job decides and posts on. A PR event names it, so
      # a later failed read still posts `error` there; a comment event reads it,
      # three tries with backoff so a transient API error does not skip the run.
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sha="$EVENT_SHA"
          for delay in 0 5 15; do
            if [[ -n "$sha" ]]; then break; fi
            sleep "$delay"
            sha="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)" || sha=""
          done
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no head sha for #$PR_NUMBER"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  status:
    needs: head
    # Serialised per head commit, not per PR: a status belongs to the commit,
    # and two PRs sharing a head each post on it. Per PR, their runs could
    # interleave and a stale success land last. Per commit, the newest queued
    # run (whichever PR fired it) decides every open PR at that head, last.
    concurrency:
      group: review-verdict-${{ needs.head.outputs.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # the PRs, their labels and changed files
      issues: read          # the PRs' comments (Review-verdict lines)
      statuses: write       # the review-verdict status, and nothing else
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Post the review-verdict status
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ needs.head.outputs.sha }}
        run: python scripts/check_review_verdict.py --pr "$PR_NUMBER" --sha "$HEAD_SHA"
