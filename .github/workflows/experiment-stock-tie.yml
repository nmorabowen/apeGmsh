# TEMPORARY — removed before the PR merges. Runs .github/experiment_stock_tie.py
# on STOCK openseespy under Python 3.11 (what live-stock uses today) and 3.12
# (the first Python the openseespylinux 3.8.0.0 wheel accepts).
name: Experiment - stock equation tie (temporary)

on:
  push:
    branches: [guppi/wizardly-chandrasekhar-a6225a]

env:
  QT_QPA_PLATFORM: offscreen
  LADRUNO_OPENSEES_QUIET: "1"

jobs:
  stock-tie-survey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install apt deps for Qt/VTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libglu1-mesa

      - name: Install package + stock openseespy
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[plot,viewer,dxf]" openseespy pytest
          pip list 2>/dev/null | grep -i -E "^(openseespy|gmsh)" || true

      - name: Wheel layout, then the bundled libs on the loader path
        run: |
          pkg=$(python -c "import importlib.util; s = importlib.util.find_spec('openseespylinux'); print(list(s.submodule_search_locations)[0])")
          echo "pkg=$pkg"
          ls -la "$pkg"
          find "$pkg" -maxdepth 2 -name "*.so*" | sort | head -60
          if [ -d "$pkg/lib" ]; then
            echo "LD_LIBRARY_PATH=$pkg/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi

      - name: Survey (element patch tests + tied stacks, gate bypassed)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python .github/experiment_stock_tie.py
