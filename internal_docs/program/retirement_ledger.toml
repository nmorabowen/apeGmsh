# The retirement ledger (program link X4-a, #1806).
#
# Panel rule: every retirement ends in deletion, with a dated CI expiry.
# One [[row]] per retiring thing. tests/test_retirement_ledger.py (lock-tests)
# fails when:
#   * a row's date has passed while any of its targets still exists;
#   * any target of a row no longer exists (delete the row with the thing);
#   * a row is malformed or undated.
#
# Every row is dated (#1199 X4 ruling 1), in one of two ways:
#   expires   = YYYY-MM-DD                  the thing is deleted by then; or
#   trigger   = "<event>" + review_by = YYYY-MM-DD
#                                           the thing goes when the event
#                                           happens; the maintainer re-dates
#                                           the row by review_by if it has not.
# Dates are bare TOML dates (no quotes). Re-dating or adding a row edits a
# land_pr.py BASELINE file, so the PR needs the human-gate label.
#
# Targets (at least one per row; paths are repo-relative, forward slashes):
#   paths   = ["file", "dir/"]              the file or directory exists
#   symbols = ["file.py::Name.attr"]        the AST defines it (def, class,
#                                           assignment, annotated field)
#   texts   = ["file::literal substring"]   the file contains the substring
#
# basis = "ruling" when the date comes from a maintainer ruling or the
# charter, "policy" when it is a proposed default the maintainer has not ruled
# on (X4-a anchors those to 2026-10-12). source names where it comes from.

