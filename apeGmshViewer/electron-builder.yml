# The apeGmshViewer installer (ADR 0112 P1: open a model by double-click).
# `npm run dist` bundles the app (scripts/build.mjs) and builds it here.
#
# Windows: a per-user NSIS installer. It installs under %LOCALAPPDATA% and
# adds the app to the "Open with" list of .h5 files under HKCU
# (packaging/installer.nsh), so it needs no admin rights. It never becomes the
# default .h5 handler, which is why there is no `fileAssociations` here: that
# key would make it the default. It is not code-signed: SmartScreen may ask
# once ("More info" -> "Run anyway").

appId: com.apegmsh.viewer
productName: apeGmshViewer
directories:
  output: out/installer
files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json
  # three.js is bundled into dist/renderer.js; only h5wasm is loaded from
  # node_modules at run time (by the main process).
  - "!node_modules/three/**"
win:
  target: nsis
nsis:
  oneClick: true
  perMachine: false
  include: packaging/installer.nsh
